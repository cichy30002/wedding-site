<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Our Wedding</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #fdf6f0;
      font-family: Georgia, 'Times New Roman', serif;
      color: #5c4a3a;
    }

    .container {
      text-align: center;
      padding: 2rem;
    }

    .rings {
      font-size: 3rem;
      margin-bottom: 1.5rem;
      letter-spacing: 0.2em;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: normal;
      letter-spacing: 0.15em;
      margin-bottom: 1rem;
    }

    .divider {
      width: 80px;
      height: 1px;
      background-color: #c8a98a;
      margin: 1rem auto;
    }

    p {
      font-size: 1.1rem;
      color: #8a7060;
      letter-spacing: 0.08em;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="rings">💍</div>
    <h1>Work in Progress</h1>
    <div class="divider"></div>
    <p>Something beautiful is coming soon.</p>
  </div>
</body>
</html>
